name: 新清歌版 PCL 构建
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qingge-build.yml'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出源码与子模块
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 应用新清歌版补丁
        shell: pwsh
        run: |
          ./patches/apply-qingge.ps1
          $ErrorActionPreference = 'Stop'
          $enc = New-Object System.Text.UTF8Encoding($true)
          $vb = 'Plain Craft Launcher 2/Pages/PageLaunch/PageLaunchLeft.xaml.vb'
          $lx = 'Plain Craft Launcher 2/Pages/PageLaunch/PageLaunchLeft.xaml'
          $lines = [IO.File]::ReadAllLines($vb)
          $out = New-Object System.Collections.Generic.List[string]
          $hitA = $false
          $hitB = $false
          foreach ($line in $lines) {
              $trim = $line.Trim()
              if ($trim -eq 'If RadioLoginType5.Checked Then') {
                  $out.Add($line.Replace('If RadioLoginType5.Checked Then', 'If False Then'))
                  $hitA = $true
                  continue
              }
              if ($trim -eq 'Case 1 ''仅正版') {
                  $indent = $line.Substring(0, $line.Length - $trim.Length)
                  $out.Add($line)
                  $out.Add($indent + '    Type = PageType.Legacy')
                  $out.Add($indent + '    Settings.Set("LoginType", McLoginType.Legacy)')
                  $out.Add($indent + '    PanType.Visibility = Visibility.Collapsed')
                  $out.Add($indent + '    PanTypeOne.Visibility = Visibility.Visible')
                  $out.Add($indent + '    PathTypeOne.Data = (New GeometryConverter).ConvertFromString(Logo.IconButtonOffline)')
                  $out.Add($indent + '    LabTypeOne.Text = "离线登录"')
                  $out.Add($indent + '    Exit Select')
                  $hitB = $true
                  continue
              }
              if ($line.Contains('RadioLoginType5.Visibility = Visibility.Visible')) {
                  $out.Add($line.Replace('RadioLoginType5.Visibility = Visibility.Visible', 'RadioLoginType5.Visibility = Visibility.Collapsed'))
                  continue
              }
              $out.Add($line)
          }
          if (-not $hitA) { throw '未找到正版/离线登录判断，隐藏正版登录失败。' }
          if (-not $hitB) { throw '未找到仅正版登录分支，隐藏正版登录失败。' }
          [IO.File]::WriteAllLines($vb, $out, $enc)
          $text = [IO.File]::ReadAllText($lx, [Text.Encoding]::UTF8)
          $text = $text.Replace('Text="正版" Margin="4,0"', 'Text="正版" Margin="4,0" Visibility="Collapsed"')
          [IO.File]::WriteAllText($lx, $text, $enc)
          Write-Host '已隐藏正版登录入口。'

          # 品牌化与允许多开
          $fm = 'Plain Craft Launcher 2/FormMain.xaml'
          $t1 = [IO.File]::ReadAllText($fm, [Text.Encoding]::UTF8)
          $t1 = $t1.Replace('Title="Plain Craft Launcher', 'Title="新清歌版 PCL')
          [IO.File]::WriteAllText($fm, $t1, $enc)
          $ab = 'Plain Craft Launcher 2/Pages/PageOtherAbout.xaml'
          $t2 = [IO.File]::ReadAllText($ab, [Text.Encoding]::UTF8)
          $t2 = $t2.Replace('Title="Plain Craft Launcher 2"', 'Title="新清歌版 PCL"')
          [IO.File]::WriteAllText($ab, $t2, $enc)
          $ap = 'Plain Craft Launcher 2/Application.xaml.vb'
          $apLines = [IO.File]::ReadAllLines($ap)
          $apOut = New-Object System.Collections.Generic.List[string]
          $hitM = $false
          foreach ($l in $apLines) {
              if ($l.Contains('If BuildType = BuildTypes.Debug Then Return')) {
                  $ind = $l.Substring(0, $l.Length - $l.Trim().Length)
                  $apOut.Add($ind + "Return ' 新清歌版：允许多开")
                  $hitM = $true
                  continue
              }
              $apOut.Add($l)
          }
          if (-not $hitM) { throw '未找到单例互斥入口，允许多开失败。' }
          [IO.File]::WriteAllLines($ap, $apOut, $enc)
          Write-Host '已品牌化并允许多开。'

      - name: 准备内置帮助文档
        shell: pwsh
        run: |
          git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1 ../PCL2Help
          Compress-Archive -Path ../PCL2Help/* -DestinationPath "Plain Craft Launcher 2/Resources/Help.zip" -Force
          Remove-Item ../PCL2Help -Recurse -Force

      - name: 配置 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: 还原 NuGet 依赖
        run: dotnet restore PCLCS/PCLCS.csproj

      - name: 编译启动器
        run: msbuild "Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj" -p:Configuration=Release -p:Platform=AnyCPU

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QinggePCL-exe
          path: Plain Craft Launcher 2/obj/Release/Plain Craft Launcher 2.exe
          if-no-files-found: error

      - name: 通过 API 保存 exe 便于下载
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "Plain Craft Launcher 2/obj/Release/Plain Craft Launcher 2.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $b64 = [Convert]::ToBase64String($bytes)
          $uri = "https://api.github.com/repos/gumeng569/PCL/contents/release/QinggePCL.exe"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "qingge-bot"; "Accept" = "application/vnd.github+json" }
          $oldSha = $null
          try { $cur = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers; $oldSha = $cur.sha } catch { Write-Host 'release 文件尚不存在，将新建。' }
          $payload = @{ message = "chore: save exe [skip ci]"; content = $b64; branch = "main" }
          if ($oldSha) { $payload.sha = $oldSha }
          $tmp = Join-Path $env:RUNNER_TEMP "body.json"
          [IO.File]::WriteAllText($tmp, ($payload | ConvertTo-Json -Compress), (New-Object System.Text.UTF8Encoding($false)))
          $resp = Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -InFile $tmp -ContentType "application/json"
          Write-Host "saved commit: $($resp.commit.sha)"
