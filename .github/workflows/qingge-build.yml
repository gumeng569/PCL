name: 新清歌版 PCL 构建
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qingge-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出源码与子模块
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 应用新清歌版补丁
        shell: pwsh
        run: ./patches/apply-qingge.ps1

      - name: 准备内置帮助文档
        shell: pwsh
        run: |
          git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1 ../PCL2Help
          Compress-Archive -Path ../PCL2Help/* -DestinationPath "Plain Craft Launcher 2\Resources\Help.zip" -Force
          Remove-Item ../PCL2Help -Recurse -Force

      - name: 配置 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: 还原 NuGet 依赖
        run: dotnet restore PCLCS\PCLCS.csproj

      - name: 编译启动器
        run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release -p:Platform=AnyCPU

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QinggePCL-exe
          path: Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe
          if-no-files-found: error

      - name: 通过 API 保存 exe 便于下载
        shell: pwwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $b64 = [Convert]::ToBase64String($bytes)
          $body = (@{ message = "chore: save exe [skip ci]"; content = $b64; branch = "main" } | ConvertTo-Json -Compress)
          $tmp = Join-Path $env:RUNNER_TEMP "body.json"
          [IO.File]::WriteAllText($tmp, $body, (New-Object System.Text.UTF8Encoding($false)))
          $uri = "https://api.github.com/repos/gumeng569/PCL/contents/release/QinggePCL.exe"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "qingge-bot"; "Accept" = "application/vnd.github+json" }
          $resp = Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -InFile $tmp -ContentType "application/json"
          Write-Host "saved commit: $($resp.commit.sha)"
